[project]
name = "openevalz-eval-wildclawbench"
version = "0.1.0"
description = "OpenEvalz packaging of WildClawBench: Productivity & Safety Evaluation"
license = { text = "BUSL-1.1" }
requires-python = ">=3.10"
dependencies = [
  "inspect-ai==0.3.260",
  "trusted-router>=0.7.0",
  "pyyaml>=6",
]

[tool.openevalz]
eval = "wildclawbench"
execution_class = "sandbox-local"
